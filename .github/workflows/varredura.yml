name: Varredura do site
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  varredura:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.47.2
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8000 >/dev/null 2>&1 &
      - run: node tests/varredura.js http://localhost:8000/index.html
